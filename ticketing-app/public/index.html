<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warden Tickets</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8E%AB%3C/text%3E%3C/svg%3E">
<style>
/* ── Reset & tokens ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0d0f14;
  --surface:  #151820;
  --surface2: #1c2030;
  --surface3: #232840;
  --border:   #2a2f45;
  --border2:  #353b55;
  --text:     #e8ecf4;
  --text-muted: #7b83a0;
  --text-dim:   #4a5170;
  --accent:   #6366f1;
  --accent-h: #818cf8;
  --green:    #22c55e;
  --yellow:   #eab308;
  --orange:   #f97316;
  --red:      #ef4444;
  --radius:   10px;
  --sidebar-w: 220px;
  --detail-w:  480px;
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

/* ── Layout ── */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.main    { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar  { height: 56px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 20px; flex-shrink: 0; background: var(--surface); }
.content { flex: 1; overflow-y: auto; padding: 20px; }

/* ── Sidebar ── */
.sidebar-brand { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
.sidebar-brand .brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #2b3046, #0d0f14 72%);
  border: 1px solid var(--border2); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px rgba(99,102,241,.08);
  display: grid; place-items: center; font-size: 16px; line-height: 1; flex-shrink: 0;
}
.sidebar-brand h1 { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
.sidebar-brand p  { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.sidebar-section  { padding: 14px 12px 8px; }
.sidebar-label    { font-size: 10px; font-weight: 700; color: var(--text-dim); letter-spacing: .8px; text-transform: uppercase; padding: 0 6px 8px; }
.nav-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px;
  cursor: pointer; color: var(--text-muted); font-size: 13px; transition: background .12s, color .12s; user-select: none;
}
.nav-item:hover         { background: var(--surface2); color: var(--text); }
.nav-item.active        { background: rgba(99,102,241,.15); color: var(--accent-h); font-weight: 600; }
.nav-item .nav-icon     { width: 16px; text-align: center; }
.nav-item .nav-badge    { margin-left: auto; font-size: 10px; background: var(--surface3); border-radius: 20px; padding: 1px 7px; color: var(--text-muted); }
.nav-item.active .nav-badge { background: rgba(99,102,241,.25); color: var(--accent-h); }

/* ── Topbar ── */
.topbar-title { font-size: 15px; font-weight: 700; color: var(--text); }
.search-wrap  { flex: 1; max-width: 340px; position: relative; }
.search-wrap input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 12px 7px 32px; font-size: 13px; color: var(--text); outline: none;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--text-dim); }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 13px; }
.btn {
  padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  border: none; transition: opacity .12s, background .12s; white-space: nowrap;
}
.btn-primary  { background: var(--accent); color: #fff; }
.btn-primary:hover  { opacity: .88; }
.btn-ghost    { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
.btn-ghost:hover    { background: var(--surface2); color: var(--text); }
.btn-danger   { background: rgba(239,68,68,.12); color: var(--red); border: 1px solid rgba(239,68,68,.2); }
.btn-danger:hover   { background: rgba(239,68,68,.2); }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* ── Stats row ── */
.stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; flex: 1; min-width: 120px; }
.stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; }
.stat-val   { font-size: 24px; font-weight: 700; color: var(--text); line-height: 1; }
.stat-sub   { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* ── Ticket list ── */
.ticket-list { display: flex; flex-direction: column; gap: 8px; }
.ticket-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; cursor: pointer; transition: border-color .15s, background .15s; display: flex; gap: 12px; align-items: flex-start;
}
.ticket-card:hover  { border-color: var(--border2); background: var(--surface2); }
.ticket-card.active { border-color: var(--accent); background: rgba(99,102,241,.06); }
.ticket-id   { font-size: 11px; color: var(--text-dim); font-weight: 600; min-width: 36px; padding-top: 2px; }
.ticket-body { flex: 1; min-width: 0; }
.ticket-title { font-weight: 600; color: var(--text); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticket-desc  { font-size: 12px; color: var(--text-muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ticket-meta  { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600; border: 1px solid transparent;
}
.chip-status-open        { background: rgba(99,102,241,.12); color: var(--accent-h); border-color: rgba(99,102,241,.2); }
.chip-status-in_progress { background: rgba(234,179,8,.10);  color: #facc15;  border-color: rgba(234,179,8,.2); }
.chip-status-resolved    { background: rgba(34,197,94,.10);  color: var(--green); border-color: rgba(34,197,94,.2); }
.chip-status-closed      { background: rgba(100,116,139,.12); color: #94a3b8; border-color: rgba(100,116,139,.2); }
.chip-prio-critical { background: rgba(239,68,68,.15); color: var(--red);    border-color: rgba(239,68,68,.25); }
.chip-prio-high     { background: rgba(249,115,22,.12); color: var(--orange); border-color: rgba(249,115,22,.2); }
.chip-prio-medium   { background: rgba(234,179,8,.10);  color: #facc15;  border-color: rgba(234,179,8,.2); }
.chip-prio-low      { background: rgba(100,116,139,.12); color: #94a3b8; border-color: rgba(100,116,139,.2); }
.chip-assignee { background: var(--surface2); color: var(--text-muted); border-color: var(--border); }
.ticket-ts    { font-size: 11px; color: var(--text-dim); min-width: max-content; padding-top: 2px; }
.empty-state  { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .big { font-size: 36px; margin-bottom: 10px; }
.empty-state h3   { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

/* ── Detail panel ── */
.detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; display: none; }
.detail-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: var(--detail-w); max-width: 100vw;
  background: var(--surface); border-left: 1px solid var(--border); z-index: 50;
  display: flex; flex-direction: column; transform: translateX(100%); transition: transform .2s ease;
}
.detail-panel.open { transform: translateX(0); }
.detail-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 12px; }
.detail-header-left { flex: 1; min-width: 0; }
.detail-id     { font-size: 11px; color: var(--text-dim); font-weight: 600; margin-bottom: 4px; }
.detail-title-edit {
  width: 100%; background: transparent; border: none; outline: none; color: var(--text);
  font-size: 16px; font-weight: 700; resize: none; font-family: inherit; line-height: 1.4;
}
.detail-title-edit:focus { background: var(--surface2); border-radius: 6px; padding: 4px 6px; }
.detail-close { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; padding: 4px; border-radius: 6px; }
.detail-close:hover { background: var(--surface2); color: var(--text); }
.detail-body  { flex: 1; overflow-y: auto; padding: 0; display: flex; flex-direction: column; }
.detail-fields { padding: 16px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-bottom: 1px solid var(--border); }
.field-group label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .7px; color: var(--text-dim); font-weight: 700; margin-bottom: 5px; }
.field-group select, .field-group input[type=text] {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
  padding: 6px 10px; font-size: 13px; color: var(--text); outline: none;
}
.field-group select:focus, .field-group input[type=text]:focus { border-color: var(--accent); }
.detail-desc-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.detail-desc-section label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .7px; color: var(--text-dim); font-weight: 700; margin-bottom: 8px; }
.detail-desc-edit {
  width: 100%; min-height: 80px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: 13px; color: var(--text); outline: none; resize: vertical; font-family: inherit; line-height: 1.6;
}
.detail-desc-edit:focus { border-color: var(--accent); }
.detail-actions { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
.comments-section { flex: 1; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.comments-section h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--text-dim); font-weight: 700; }
.comment-list  { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.comment-card  { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.comment-meta  { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.comment-author { font-size: 12px; font-weight: 600; color: var(--accent-h); }
.comment-time   { font-size: 11px; color: var(--text-dim); }
.comment-body   { font-size: 13px; color: var(--text); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.comment-del    { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 12px; }
.comment-del:hover { color: var(--red); }
.comment-form   { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.comment-form textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: 13px; color: var(--text); outline: none; resize: none; font-family: inherit; min-height: 70px;
}
.comment-form textarea:focus { border-color: var(--accent); }
.comment-form-row { display: flex; gap: 8px; align-items: center; }
.comment-form-row input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
  padding: 6px 10px; font-size: 12px; color: var(--text); outline: none;
}
.comment-form-row input:focus { border-color: var(--accent); }

/* ── Modal ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 60; display: flex; align-items: center; justify-content: center; display: none; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 520px; max-width: calc(100vw - 32px); padding: 24px; }
.modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 20px; }
.form-row  { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-dim); margin-bottom: 6px; }
.form-group input[type=text],
.form-group select,
.form-group textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: 13px; color: var(--text); outline: none; font-family: inherit;
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

/* ── Filter bar ── */
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filter-select { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--text); outline: none; cursor: pointer; }
.filter-select:focus { border-color: var(--accent); }
.filter-label { font-size: 12px; color: var(--text-muted); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand">
        <div class="brand-mark" aria-label="Warden Tickets logo">🎫</div>
        <h1>Warden Tickets</h1>
      </div>
      <p id="sb-total">Loading…</p>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Status</div>
      <div class="nav-item active" data-filter="status:all"     onclick="setFilter('status','all')">        <span class="nav-icon">📋</span> All tickets     <span class="nav-badge" id="nb-all">—</span></div>
      <div class="nav-item"        data-filter="status:open"    onclick="setFilter('status','open')">       <span class="nav-icon">🔵</span> Open            <span class="nav-badge" id="nb-open">—</span></div>
      <div class="nav-item"        data-filter="status:in_progress" onclick="setFilter('status','in_progress')"><span class="nav-icon">🟡</span> In Progress     <span class="nav-badge" id="nb-in_progress">—</span></div>
      <div class="nav-item"        data-filter="status:resolved" onclick="setFilter('status','resolved')">  <span class="nav-icon">🟢</span> Resolved        <span class="nav-badge" id="nb-resolved">—</span></div>
      <div class="nav-item"        data-filter="status:closed"  onclick="setFilter('status','closed')">     <span class="nav-icon">⚫</span> Closed          <span class="nav-badge" id="nb-closed">—</span></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Priority</div>
      <div class="nav-item" data-filter="priority:critical" onclick="setFilter('priority','critical')"><span class="nav-icon">🔴</span> Critical</div>
      <div class="nav-item" data-filter="priority:high"     onclick="setFilter('priority','high')">    <span class="nav-icon">🟠</span> High</div>
      <div class="nav-item" data-filter="priority:medium"   onclick="setFilter('priority','medium')">  <span class="nav-icon">🟡</span> Medium</div>
      <div class="nav-item" data-filter="priority:low"      onclick="setFilter('priority','low')">     <span class="nav-icon">⚪</span> Low</div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="topbar-title">All Tickets</span>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search tickets…" oninput="onSearch()" />
      </div>
      <button class="btn btn-primary" onclick="openNewModal()">+ New Ticket</button>
    </div>
    <div class="content">
      <div class="stats-row" id="stats-row">
        <div class="stat-card"><div class="stat-label">Total</div><div class="stat-val" id="st-total">—</div></div>
        <div class="stat-card"><div class="stat-label">Open</div><div class="stat-val" id="st-open" style="color:var(--accent-h)">—</div></div>
        <div class="stat-card"><div class="stat-label">In Progress</div><div class="stat-val" id="st-inprog" style="color:#facc15">—</div></div>
        <div class="stat-card"><div class="stat-label">Resolved</div><div class="stat-val" id="st-resolved" style="color:var(--green)">—</div></div>
        <div class="stat-card"><div class="stat-label">Critical</div><div class="stat-val" id="st-critical" style="color:var(--red)">—</div></div>
      </div>
      <div class="ticket-list" id="ticket-list"></div>
    </div>
  </div>
</div>

<!-- Detail panel overlay -->
<div class="detail-overlay" id="detail-overlay" onclick="closeDetail()"></div>

<!-- Detail panel -->
<div class="detail-panel" id="detail-panel">
  <div class="detail-header">
    <div class="detail-header-left">
      <div class="detail-id" id="d-id">#—</div>
      <textarea class="detail-title-edit" id="d-title" rows="1" oninput="autoResize(this)" onblur="saveField('title', this.value)"></textarea>
    </div>
    <button class="detail-close" onclick="closeDetail()">✕</button>
  </div>
  <div class="detail-body">
    <div class="detail-fields">
      <div class="field-group">
        <label>Status</label>
        <select id="d-status" onchange="saveField('status', this.value)">
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="resolved">Resolved</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <div class="field-group">
        <label>Priority</label>
        <select id="d-priority" onchange="saveField('priority', this.value)">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </div>
      <div class="field-group" style="grid-column:1/-1">
        <label>Assignee</label>
        <input type="text" id="d-assignee" placeholder="email or name" onblur="saveField('assignee', this.value)">
      </div>
    </div>
    <div class="detail-desc-section">
      <label>Description</label>
      <textarea class="detail-desc-edit" id="d-desc" placeholder="Add a description…" onblur="saveField('description', this.value)"></textarea>
    </div>
    <div class="detail-actions">
      <button class="btn btn-danger btn-sm" onclick="deleteTicket()">🗑 Delete</button>
      <span id="d-timestamps" style="font-size:11px;color:var(--text-dim);margin-left:auto;align-self:center"></span>
    </div>
    <div class="comments-section">
      <h4>Comments <span id="d-cmt-count" style="font-weight:400;color:var(--text-dim)"></span></h4>
      <div class="comment-list" id="comment-list"></div>
      <div class="comment-form">
        <textarea id="cmt-body" placeholder="Write a comment…" rows="2"></textarea>
        <div class="comment-form-row">
          <input type="text" id="cmt-author" placeholder="Your name (optional)" value="">
          <button class="btn btn-primary btn-sm" onclick="addComment()">Post</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- New ticket modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>New Ticket</h2>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="m-title" placeholder="Short, descriptive title">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="m-desc" placeholder="What happened? Steps to reproduce, expected behavior…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Status</label>
        <select id="m-status">
          <option value="open" selected>Open</option>
          <option value="in_progress">In Progress</option>
          <option value="resolved">Resolved</option>
        </select>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="m-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Assignee</label>
      <input type="text" id="m-assignee" placeholder="email or name">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createTicket()">Create Ticket</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let currentFilter = { status: 'all', priority: 'all' };
let searchQuery   = '';
let currentId     = null;
let searchTimer   = null;

// ── API ────────────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || res.statusText); }
  return res.json().catch(() => ({}));
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts + (ts.endsWith('Z') ? '' : 'Z'));
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' }) + ' ' +
         d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}

function fmtRelative(ts) {
  if (!ts) return '';
  const d = new Date(ts + (ts.endsWith('Z') ? '' : 'Z'));
  const diff = (Date.now() - d) / 1000;
  if (diff < 60)   return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

// ── Load ───────────────────────────────────────────────────────────────────────
async function loadAll() {
  const params = new URLSearchParams();
  if (currentFilter.status   !== 'all') params.set('status',   currentFilter.status);
  if (currentFilter.priority !== 'all') params.set('priority', currentFilter.priority);
  if (searchQuery) params.set('q', searchQuery);
  const [tickets, stats] = await Promise.all([
    api('/tickets?' + params),
    api('/stats'),
  ]);
  renderStats(stats);
  renderList(tickets);
}

function renderStats(stats) {
  const by = Object.fromEntries(stats.byStatus.map(r => [r.status, r.n]));
  const bp = Object.fromEntries(stats.byPriority.map(r => [r.priority, r.n]));
  document.getElementById('st-total').textContent    = stats.total;
  document.getElementById('st-open').textContent     = by.open     || 0;
  document.getElementById('st-inprog').textContent   = by.in_progress || 0;
  document.getElementById('st-resolved').textContent = by.resolved  || 0;
  document.getElementById('st-critical').textContent = bp.critical  || 0;
  document.getElementById('sb-total').textContent    = `${stats.total} ticket${stats.total !== 1 ? 's' : ''}`;
  // Update sidebar badges
  document.getElementById('nb-all').textContent         = stats.total;
  document.getElementById('nb-open').textContent        = by.open     || 0;
  document.getElementById('nb-in_progress').textContent = by.in_progress || 0;
  document.getElementById('nb-resolved').textContent    = by.resolved  || 0;
  document.getElementById('nb-closed').textContent      = by.closed    || 0;
}

function renderList(tickets) {
  const list = document.getElementById('ticket-list');
  if (!tickets.length) {
    list.innerHTML = `<div class="empty-state"><div class="big">🎫</div><h3>No tickets found</h3><p>Try adjusting your filter or search.</p></div>`;
    return;
  }
  list.innerHTML = tickets.map(t => {
    const priorityChip = `<span class="chip chip-prio-${esc(t.priority)}">${esc(t.priority)}</span>`;
    const statusChip   = `<span class="chip chip-status-${esc(t.status)}">${esc(t.status.replace('_',' '))}</span>`;
    const assigneeChip = t.assignee ? `<span class="chip chip-assignee">👤 ${esc(t.assignee)}</span>` : '';
    return `
      <div class="ticket-card${currentId === t.id ? ' active' : ''}" onclick="openDetail(${t.id})">
        <div class="ticket-id">#${t.id}</div>
        <div class="ticket-body">
          <div class="ticket-title">${esc(t.title)}</div>
          ${t.description ? `<div class="ticket-desc">${esc(t.description)}</div>` : ''}
          <div class="ticket-meta">${statusChip}${priorityChip}${assigneeChip}</div>
        </div>
        <div class="ticket-ts">${fmtRelative(t.updated_at)}</div>
      </div>`;
  }).join('');
}

// ── Filters ────────────────────────────────────────────────────────────────────
function setFilter(type, value) {
  currentFilter[type] = value;
  // Reset the other filter when switching mode
  if (type === 'status')   currentFilter.priority = 'all';
  if (type === 'priority') currentFilter.status   = 'all';
  // Update active nav item
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === `${type}:${value}`);
  });
  const labels = { all:'All Tickets', open:'Open', in_progress:'In Progress', resolved:'Resolved', closed:'Closed', critical:'Critical', high:'High', medium:'Medium', low:'Low' };
  document.getElementById('topbar-title').textContent = labels[value] || value;
  loadAll();
}

function onSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchQuery = document.getElementById('search-input').value.trim(); loadAll(); }, 280);
}

// ── Detail panel ───────────────────────────────────────────────────────────────
async function openDetail(id) {
  currentId = id;
  document.getElementById('detail-overlay').style.display = 'block';
  document.getElementById('detail-panel').classList.add('open');
  // Mark active card
  document.querySelectorAll('.ticket-card').forEach(c => c.classList.toggle('active', c.onclick?.toString().includes(`openDetail(${id})`)));
  await refreshDetail(id);
}

async function refreshDetail(id) {
  const t = await api(`/tickets/${id}`).catch(() => null);
  if (!t) return;
  document.getElementById('d-id').textContent      = `#${t.id}`;
  document.getElementById('d-title').value         = t.title;
  document.getElementById('d-status').value        = t.status;
  document.getElementById('d-priority').value      = t.priority;
  document.getElementById('d-assignee').value      = t.assignee || '';
  document.getElementById('d-desc').value          = t.description || '';
  document.getElementById('d-timestamps').textContent = `Created ${fmtDate(t.created_at)} · Updated ${fmtDate(t.updated_at)}`;
  autoResize(document.getElementById('d-title'));
  renderComments(t.id, t.comments || []);
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function renderComments(ticketId, comments) {
  document.getElementById('d-cmt-count').textContent = comments.length ? `(${comments.length})` : '';
  const list = document.getElementById('comment-list');
  if (!comments.length) {
    list.innerHTML = '<div style="font-size:12px;color:var(--text-dim);padding:4px 0">No comments yet.</div>';
    return;
  }
  list.innerHTML = comments.map(c => `
    <div class="comment-card">
      <div class="comment-meta">
        <span class="comment-author">👤 ${esc(c.author)}</span>
        <span style="display:flex;gap:8px;align-items:center">
          <span class="comment-time">${fmtDate(c.created_at)}</span>
          <button class="comment-del" onclick="deleteComment(${ticketId}, ${c.id})" title="Delete">✕</button>
        </span>
      </div>
      <div class="comment-body">${esc(c.body)}</div>
    </div>`).join('');
}

async function saveField(field, value) {
  if (!currentId) return;
  await api(`/tickets/${currentId}`, { method: 'PUT', body: { [field]: value } }).catch(() => {});
  loadAll();
}

async function addComment() {
  const body   = document.getElementById('cmt-body').value.trim();
  const author = document.getElementById('cmt-author').value.trim();
  if (!body) return;
  await api(`/tickets/${currentId}/comments`, { method: 'POST', body: { body, author: author || 'Anonymous' } });
  document.getElementById('cmt-body').value = '';
  await refreshDetail(currentId);
}

async function deleteComment(ticketId, cid) {
  if (!confirm('Delete this comment?')) return;
  await api(`/tickets/${ticketId}/comments/${cid}`, { method: 'DELETE' });
  await refreshDetail(currentId);
}

async function deleteTicket() {
  if (!currentId || !confirm('Delete this ticket? This cannot be undone.')) return;
  await api(`/tickets/${currentId}`, { method: 'DELETE' });
  closeDetail();
  loadAll();
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('detail-overlay').style.display = 'none';
  document.querySelectorAll('.ticket-card').forEach(c => c.classList.remove('active'));
  currentId = null;
}

// ── New ticket modal ───────────────────────────────────────────────────────────
function openNewModal() {
  document.getElementById('m-title').value    = '';
  document.getElementById('m-desc').value     = '';
  document.getElementById('m-status').value   = 'open';
  document.getElementById('m-priority').value = 'medium';
  document.getElementById('m-assignee').value = '';
  document.getElementById('modal-overlay').style.display = 'flex';
  setTimeout(() => document.getElementById('m-title').focus(), 50);
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}

async function createTicket() {
  const title = document.getElementById('m-title').value.trim();
  if (!title) { document.getElementById('m-title').focus(); return; }
  const payload = {
    title,
    description: document.getElementById('m-desc').value.trim(),
    status:      document.getElementById('m-status').value,
    priority:    document.getElementById('m-priority').value,
    assignee:    document.getElementById('m-assignee').value.trim(),
  };
  const { id } = await api('/tickets', { method: 'POST', body: payload });
  closeModal();
  await loadAll();
  openDetail(id);
}

// ── Keyboard shortcuts ─────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeDetail(); }
  if (e.key === 'n' && !e.target.matches('input,textarea,select')) openNewModal();
});

// Dismiss modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── Boot ───────────────────────────────────────────────────────────────────────
loadAll();
</script>
</body>
</html>
